# =====================================================================
#  Hệ thống tìm kiếm nhà trọ và ghép bạn cùng phòng - cấu hình ứng dụng
# =====================================================================
spring.application.name=nha-tro-btl

# ---------- MySQL ----------
# Không ghi mật khẩu thật vào đây. Mỗi thành viên tự đặt biến môi trường
# DB_USERNAME / DB_PASSWORD trên máy mình (xem README.md).
spring.datasource.url=jdbc:mysql://localhost:3306/nha_tro_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# none: KHÔNG để Hibernate tự tạo/sửa bảng. CSDL do database/schema.sql tạo
# (kèm ràng buộc CHECK, index và trigger).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Redis (Thành viên 3) ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379
